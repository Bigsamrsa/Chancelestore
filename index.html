<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bongekile Ultimate - AI + Admin + Stock</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui}</style>
</head>
<body class="bg-black text-white">
<div class="max-w-md mx-auto">

<div class="p-4 flex justify-between items-center sticky top-0 bg-black z-20 border-b border-zinc-800">
<h1 class="font-black">BONGEKILE<span class="text-yellow-400">.ULTIMATE</span><br><span class="text-[8px] opacity-40">FREE AI + ADMIN + STOCK</span></h1>
<button onclick="toggleAdmin()" class="bg-yellow-400 text-black px-3 py-2 rounded-full font-black text-xs">⚙️ ADMIN</button>
</div>

<!-- STORE -->
<div id="storeView">
<!-- FREE AI -->
<div class="m-4 bg-zinc-900 rounded-2xl p-4 border border-yellow-500/30">
<div class="flex justify-between"><p class="font-black text-xs">🧠 FREE AI - Zulu/English</p><p class="text-[10px] bg-green-500 text-black px-2 rounded-full font-black">LIVE</p></div>
<div id="chat" class="bg-black rounded-xl p-3 h-32 overflow-y-auto text-xs mt-2">AI: Sawubona! Ask "Yini eshibhile?" or "Dinner R150" 🆓</div>
<div class="flex gap-2 mt-2"><input id="q" onkeypress="if(event.key==='Enter')askAI()" placeholder="Ask AI..." class="flex-1 p-3 rounded-full bg-zinc-800 text-xs"><button onclick="askAI()" class="bg-yellow-400 text-black px-4 rounded-full font-black text-xs">Ask</button></div>
</div>

<div class="px-4 flex gap-2 overflow-x-auto text-[11px]"><button onclick="filterCat('all')" class="bg-yellow-400 text-black px-3 py-1 rounded-full font-black">All</button><button onclick="filterCat('food')" class="bg-zinc-800 px-3 py-1 rounded-full">🍚 Food</button><button onclick="filterCat('beauty')" class="bg-zinc-800 px-3 py-1 rounded-full">💄 Beauty</button><button onclick="filterCat('clothes')" class="bg-zinc-800 px-3 py-1 rounded-full">👗 Clothes</button><button onclick="filterCat('house')" class="bg-zinc-800 px-3 py-1 rounded-full">🧹 House</button></div>

<div id="grid" class="grid grid-cols-2 gap-3 p-4"></div>
<div id="cartBtn" onclick="document.getElementById('cart').classList.remove('hidden')" class="fixed bottom-4 right-4 bg-yellow-400 text-black px-5 py-3 rounded-full font-black">🛒 <span id="cartCount">0</span> • R<span id="cartTotal">0</span></div>
</div>

<!-- ADMIN ULTIMATE -->
<div id="adminView" class="hidden p-4">
<div class="bg-yellow-400 text-black rounded-2xl p-4 font-black">📸 ULTIMATE ADMIN<br><span class="text-xs font-bold">Add product + photo + stock + category</span></div>
<div class="bg-zinc-900 rounded-2xl p-4 mt-4">
<input id="pName" placeholder="Name e.g. Maize 10kg" class="w-full p-3 rounded-full bg-black border text-sm">
<input id="pPrice" type="number" placeholder="Price e.g. 120" class="w-full p-3 rounded-full bg-black border mt-2 text-sm">
<input id="pStock" type="number" placeholder="Stock e.g. 20" value="10" class="w-full p-3 rounded-full bg-black border mt-2 text-sm">
<select id="pCat" class="w-full p-3 rounded-full bg-black border mt-2 text-sm"><option value="food">🍚 Food</option><option value="beauty">💄 Beauty</option><option value="clothes">👗 Clothes</option><option value="house">🧹 House</option><option value="other">Other</option></select>
<input id="pFile" type="file" accept="image/*" class="w-full p-2 bg-black rounded-full border mt-2 text-xs">
<img id="preview" class="w-full h-40 object-cover rounded-xl mt-2 hidden border-2 border-yellow-400">
<button onclick="saveProduct()" class="w-full bg-yellow-400 text-black py-3 rounded-full font-black mt-3">✅ SAVE</button>
<p id="status" class="text-xs text-center mt-2 opacity-50"></p>
</div>
<div id="adminList" class="mt-4 space-y-2"></div>
<button onclick="toggleAdmin()" class="w-full bg-zinc-800 py-3 rounded-full font-black mt-6">← Back to Store</button>
</div>

<div id="cart" class="hidden fixed inset-0 bg-black/90 z-50 p-4"><div class="bg-white text-black rounded-2xl p-4 max-w-sm mx-auto"><div id="cartList"></div><p class="font-black mt-3">Total R<span id="total">0</span></p><button onclick="orderWA()" class="w-full bg-black text-white py-3 rounded-full font-black mt-3">WhatsApp Order</button><button onclick="document.getElementById('cart').classList.add('hidden')" class="w-full bg-zinc-100 py-2 rounded-full mt-2">Close</button></div></div>
</div>
