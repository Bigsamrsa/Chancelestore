<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHANCELE ONLINE STORE - Premium African Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif}
@keyframes shine{0%{background-position:-800px 0}100%{background-position:800px 0}}
.gold-title{font-family:'Anton',sans-serif; background:linear-gradient(90deg,#8A6D3B 0%,#FFD700 25%,#FFFDE7 50%,#FFD700 75%,#8A6D3B 100%); background-size:1200px 100%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:shine 4s infinite linear; text-shadow:0 0 40px rgba(255,215,0,0.4)}
</style>
</head>
<body class="bg-black text-white">

<!-- HEADER -->
<header class="sticky top-0 z-40 bg-black border-b border-yellow-500/30">
<div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
<h1 class="font-black text-xl tracking-tight">CHANCELE<span class="text-yellow-400">.STORE</span></h1>
<div class="flex gap-2">
<a href="https://wa.me/27661898133" class="bg-yellow-400 text-black px-5 py-2 rounded-full font-black text-xs">WhatsApp 066 189 8133</a>
<button onclick="document.getElementById('admin').classList.toggle('hidden')" class="bg-zinc-800 px-3 py-2 rounded-full text-xs font-bold">ADMIN</button>
</div>
</div>
</header>

<!-- HERO WITH BIG GOLD TITLE -->
<section class="text-center py-16 px-4 bg-gradient-to-b from-black to-zinc-900">
<p class="text-yellow-400 tracking-[0.3em] text-xs font-bold mb-4">CODE CHANCELE ONLINE STORE</p>
<h1 class="gold-title text-[13vw] md:text-[90px] leading-[0.85]">CHANCELE<br>ONLINE STORE</h1>
<p class="mt-6 text-zinc-400 tracking-widest text-xs">PREMIUM • AFRICAN • LUXURY • CHANCELE • BONGEKILE</p>
<div class="mt-8 flex justify-center gap-3">
<a href="#shop" class="bg-yellow-400 text-black px-8 py-3 rounded-full font-black">SHOP NOW</a>
<a href="https://wa.me/27661898133?text=Sawubona%20Bongekile" class="border border-yellow-400 text-yellow-400 px-8 py-3 rounded-full font-black">ORDER ON WHATSAPP</a>
</div>
</section>

<!-- AI -->
<div class="max-w-xl mx-auto px-4 -mt-6">
<div class="bg-zinc-900 border border-yellow-500/20 rounded-2xl p-4">
<div id="chat" class="text-xs bg-black rounded-xl p-3 h-20 overflow-y-auto">AI: Sawubona! Ask "Yini eshibhile?" 🆓</div>
<div class="flex gap-2 mt-2"><input id="q" placeholder="Ask AI..." class="flex-1 bg-black border border-zinc-700 rounded-full px-4 py-2 text-xs"><button onclick="askAI()" class="bg-yellow-400 text-black px-5 rounded-full font-black text-xs">ASK</button></div>
</div>
</div>

<!-- SHOP -->
<section id="shop" class="max-w-6xl mx-auto p-4">
<div class="flex gap-2 overflow-x-auto py-4 text-xs">
<button onclick="filterCat('all')" id="f-all" class="bg-yellow-400 text-black px-4 py-2 rounded-full font-black">ALL</button>
<button onclick="filterCat('food')" id="f-food" class="bg-zinc-800 px-4 py-2 rounded-full">FOOD</button>
<button onclick="filterCat('beauty')" id="f-beauty" class="bg-zinc-800 px-4 py-2 rounded-full">BEAUTY</button>
<button onclick="filterCat('clothes')" id="f-clothes" class="bg-zinc-800 px-4 py-2 rounded-full">CLOTHES</button>
</div>
<div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
</section>

<!-- CART FLOAT -->
<div id="cartBtn" onclick="document.getElementById('cart').classList.remove('hidden')" class="fixed bottom-6 right-6 bg-yellow-400 text-black px-6 py-4 rounded-full font-black shadow-[0_0_30px_gold] z-30 cursor-pointer">🛒 <span id="cartCount">0</span> • R<span id="cartTotal">0</span></div>

<!-- ADMIN -->
<div id="admin" class="hidden fixed inset-0 bg-black z-50 overflow-y-auto p-4">
<div class="max-w-md mx-auto bg-zinc-900 rounded-2xl p-5">
<h2 class="font-black">ADMIN - Add Product</h2>
<input id="pName" placeholder="Name" class="w-full mt-3 p-3 rounded-full bg-black border text-sm">
<input id="pPrice" type="number" placeholder="Price" class="w-full mt-2 p-3 rounded-full bg-black border text-sm">
<input id="pFile" type="file" accept="image/*" class="w-full mt-2 text-xs">
<img id="preview" class="hidden w-full h-40 object-cover rounded-xl mt-2 border-2 border-yellow-400">
<button onclick="saveProduct()" class="w-full bg-yellow-400 text-black py-3 rounded-full font-black mt-3">SAVE</button>
<div id="adminList" class="mt-4"></div>
<button onclick="document.getElementById('admin').classList.add('hidden')" class="w-full bg-zinc-800 py-3 rounded-full mt-4">CLOSE</button>
</div>
</div>

<!-- CART MODAL -->
<div id="cart" class="hidden fixed inset-0 bg-black/90 z-50 p-4">
<div class="bg-white text-black rounded-2xl p-5 max-w-sm mx-auto"><div id="cartList"></div><p class="font-black mt-3">Total R<span id="total">0</span></p><button onclick="orderWA()" class="w-full bg-black text-white py-3 rounded-full font-black mt-3">Order WhatsApp 066 189 8133</button><button onclick="document.getElementById('cart').classList.add('hidden')" class="w-full bg-zinc-100 py-2 rounded-full mt-2">Close</button></div>
</div>

<script>
const WA="27661898133";
let products=JSON.parse(localStorage.getItem('chancele_v2')||'[]');
if(!products.length) products=[{id:1,n:"Maize 10kg",p:120,s:15,c:"food",img:"https://via.placeholder.com/400x300/FFD700/000?text=Maize"}, {id:2,n:"Oil 2L",p:65,s:10,c:"food",img:"https://via.placeholder.com/400x300/FFA500/000?text=Oil"}, {id:3,n:"Sugar 2kg",p:55,s:20,c:"food",img:"https://via.placeholder.com/400x300/FFF/000?text=Sugar"}];
let cart=[],tempImg='',cur='all';
document.getElementById('pFile').addEventListener('change',e=>{let r=new FileReader(); r.onload=ev=>{let im=new Image(); im.onload=()=>{let ca=document.createElement('canvas'); ca.width=400; ca.height=300; ca.getContext('2d').drawImage(im,0,0,400,300); tempImg=ca.toDataURL('image/jpeg',0.6); document.getElementById('preview').src=tempImg; document.getElementById('preview').classList.remove('hidden')}; im.src=ev.target.result}; r.readAsDataURL(e.target.files[0])});
function saveProduct(){let n=document.getElementById('pName').value, p=parseInt(document.getElementById('pPrice').value); if(!n||!p||!tempImg) return alert('Name+Price+Photo'); products.push({id:Date.now(),n:n,p:p,s:10,c:"food",img:tempImg}); localStorage.setItem('chancele_v2',JSON.stringify(products)); render()}
function render(){let list=cur==='all'?products:products.filter(x=>x.c===cur); document.getElementById('grid').innerHTML=list.map(x=>`<div class="bg-zinc-900 rounded-2xl overflow-hidden border border-zinc-800"><img src="${x.img}" class="w-full h-40 object-cover"><div class="p-3"><p class="font-bold text-xs">${x.n}</p><p class="text-yellow-400 font-black">R${x.p}</p><button onclick="addCart(${x.id})" class="w-full bg-white text-black py-2 rounded-full font-black text-xs mt-2">ADD TO CART</button></div></div>`).join(''); document.getElementById('adminList').innerHTML=products.map(x=>`<div class="flex gap-2 bg-black p-2 rounded-xl mt-2"><img src="${x.img}" class="w-10 h-10 rounded"><span class="text-xs">${x.n} R${x.p}</span></div>`).join(''); updateCart()}
function addCart(id){let p=products.find(a=>a.id===id); let ex=cart.find(a=>a.id===id); if(ex) ex.q++; else cart.push({...p,q:1}); updateCart(); document.getElementById('cart').classList.remove('hidden')}
function updateCart(){document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.q,0); let t=cart.reduce((a,b)=>a+b.p*b.q,0); document.getElementById('cartTotal').innerText=t; document.getElementById('total').innerText=t; document.getElementById('cartList').innerHTML=cart.map((c,i)=>`<div class="flex justify-between text-sm bg-zinc-100 p-2 rounded-xl">${c.n} x${c.q} <b>R${c.p*c.q} <button onclick="cart.splice(${i},1);updateCart()">x</button></b></div>`).join('')||'Empty'}
function filterCat(c){cur=c; document.querySelectorAll('[id^=f-]').forEach(b=>b.className='bg-zinc-800 px-4 py-2 rounded-full'); document.getElementById('f-'+c).className='bg-yellow-400 text-black px-4 py-2 rounded-full font-black'; render()}
function askAI(){let q=document.getElementById('q').value; if(!q) return; let ch=document.getElementById('chat'); ch.innerHTML+=`<div class="text-yellow-400">You: ${q}</div>`; let f=products.filter(p=>p.n.toLowerCase().includes(q.toLowerCase())); ch.innerHTML+=`<div class="bg-zinc-800 p-2 rounded mt-1">AI: ${f.length?f.map(p=>p.n+' R'+p.p).join(', '):'Try maize, oil, sugar'}</div>`}
function orderWA(){let t=cart.reduce((a,b)=>a+b.p*b.q,0); window.open('https://wa.me/'+WA+'?text='+encodeURIComponent('Order CHANCELE:\n'+cart.map(c=>c.n+' x'+c.q).join('\n')+'\nTotal R'+t))}
render();
</script>
</body>
</html>
