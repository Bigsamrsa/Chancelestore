<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KZN STORE - FINAL FIXED</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:system-ui,sans-serif}
.gold{background:linear-gradient(90deg,#8A6D3B,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
.count{font-family:monospace;font-weight:900}
</style>
</head>
<body class="bg-black text-white">

<header class="sticky top-0 z-40 bg-black border-b border-yellow-500/30 p-3 flex justify-between">
<h1 class="font-black">KZN<span class="text-yellow-400">.STORE</span></h1>
<div class="flex gap-2">
<button onclick="showView('wallet')" class="bg-yellow-400 text-black px-3 py-2 rounded-full font-black text-xs">💰 R<span id="hWallet">0</span></button>
<button onclick="showView('auction')" class="bg-red-600 px-3 py-2 rounded-full text-xs font-black">AUCTION</button>
<button onclick="openAdmin()" class="bg-zinc-800 px-3 py-2 rounded-full text-xs">🔒 ADMIN</button>
</div>
</header>

<div class="text-center py-6 border-b-2 border-yellow-500">
<h1 class="text-6xl font-black gold">KZN ONLINE STORE</h1>
<p class="text-xs text-zinc-500 mt-2">FINAL FIXED • PIN 10111 • 078 931 3670</p>
<div class="mt-3 flex justify-center gap-2">
<button onclick="showView('auction')" class="bg-red-600 px-5 py-2 rounded-full font-black text-xs">AUCTION</button>
<button onclick="showView('wallet')" class="bg-yellow-400 text-black px-5 py-2 rounded-full font-black text-xs">WALLET</button>
<button onclick="showView('shop')" class="bg-white text-black px-5 py-2 rounded-full font-black text-xs">SHOP</button>
</div>
</div>

<div class="max-w-6xl mx-auto p-4">
<div id="walletView" class="hidden"><div class="bg-zinc-900 border border-yellow-500 rounded-2xl p-5"><h2 class="font-black text-yellow-400">💰 WALLET</h2><div id="walletStatus"></div><div class="mt-4 bg-black p-4 rounded-xl"><input id="topUpAmount" type="number" placeholder="500" class="w-full p-3 rounded-full bg-zinc-900 border"><div class="grid grid-cols-4 gap-2 mt-2"><button onclick="quickTopUp(100)" class="bg-zinc-800 py-2 rounded-full text-xs">+100</button><button onclick="quickTopUp(200)" class="bg-zinc-800 py-2 rounded-full text-xs">+200</button><button onclick="quickTopUp(500)" class="bg-zinc-800 py-2 rounded-full text-xs">+500</button><button onclick="quickTopUp(1000)" class="bg-zinc-800 py-2 rounded-full text-xs">+1000</button></div><button onclick="requestTopUp()" class="w-full mt-3 bg-yellow-400 text-black py-3 rounded-full font-black">REQUEST TOP UP</button></div><div id="walletHistory" class="mt-4 bg-zinc-900 p-4 rounded-xl"></div></div></div>
<div id="auctionView"><div class="bg-red-900/30 border border-red-500 rounded-2xl p-4 mb-4"><h2 class="font-black">🔥 LIVE AUCTION - FIXED</h2><div id="regStatus" class="mt-2"></div></div><div id="regBox" class="bg-zinc-900 border border-yellow-500/30 rounded-2xl p-5 mb-6"><input id="regName" placeholder="Full Name" class="w-full p-3 rounded-full bg-black border"><input id="regPhone" placeholder="Phone" class="w-full mt-2 p-3 rounded-full bg-black border"><input id="regLoc" placeholder="Location" class="w-full mt-2 p-3 rounded-full bg-black border"><button onclick="registerAuction()" class="w-full mt-3 bg-yellow-400 text-black py-3 rounded-full font-black">REGISTER R40</button></div><div id="auctionGrid" class="grid md:grid-cols-2 gap-4"></div></div>
<div id="shopView" class="hidden"><div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div></div>
</div>

<!-- PIN MODAL -->
<div id="pinModal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
<div class="bg-zinc-900 border-2 border-yellow-500 rounded-2xl p-6 w-full max-w-sm text-center">
<h2 class="font-black text-yellow-400">PIN 10111</h2>
<input id="pinInput" type="password" placeholder="10111" class="w-full mt-4 p-4 rounded-full bg-black border text-center text-xl">
<button onclick="checkPin()" class="w-full mt-4 bg-yellow-400 text-black py-3 rounded-full font-black">UNLOCK</button>
<button onclick="document.getElementById('pinModal').classList.add('hidden')" class="w-full mt-2 bg-zinc-800 py-2 rounded-full text-xs">Cancel</button>
<p id="pinError" class="hidden text-red-500 text-xs mt-2">Wrong PIN! Use 10111</p>
</div>
</div>

<!-- BID CONFIRM -->
<div id="bidModal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
<div class="bg-zinc-900 border-2 border-yellow-500 rounded-2xl p-6 w-full max-w-sm text-center">
<h2 class="font-black text-yellow-400">Confirm Bid?</h2>
<p id="bidText" class="mt-3 text-sm"></p>
<p id="bidWallet" class="mt-2 text-xs text-zinc-400"></p>
<div class="flex gap-2 mt-5">
<button onclick="confirmBid()" class="flex-1 bg-yellow-400 text-black py-3 rounded-full font-black">YES BID</button>
<button onclick="document.getElementById('bidModal').classList.add('hidden')" class="flex-1 bg-zinc-800 py-3 rounded-full">CANCEL</button>
</div>
</div>
</div>

<!-- ADMIN -->
<div id="admin" class="hidden fixed inset-0 bg-black z-50 overflow-y-auto p-4">
<div class="max-w-xl mx-auto bg-zinc-900 rounded-2xl p-5">
<div class="flex justify-between"><h2 class="font-black text-yellow-400">ADMIN 10111</h2><button onclick="logoutAdmin()" class="bg-red-600 px-3 py-1 rounded-full text-xs">LOCK</button></div>
<div class="flex gap-2 mt-4"><button onclick="adminTab('auction')" id="at-auction" class="bg-yellow-400 text-black px-4 py-2 rounded-full font-black text-xs">AUCTION</button><button onclick="adminTab('bidders')" id="at-bidders" class="bg-zinc-800 px-4 py-2 rounded-full text-xs">BIDDERS</button><button onclick="adminTab('topups')" id="at-topups" class="bg-zinc-800 px-4 py-2 rounded-full text-xs">TOPUPS</button></div>
<div id="admin-auction" class="mt-4">
<div class="bg-black p-4 rounded-xl border border-red-500/30">
<input id="aName" placeholder="Item Name" class="w-full p-3 rounded-full bg-zinc-900 border">
<input id="aPrice" type="number" placeholder="Start Price" class="w-full mt-2 p-3 rounded-full bg-zinc-900 border">
<input id="aStep" type="number" value="10" placeholder="Bid Step" class="w-full mt-2 p-3 rounded-full bg-zinc-900 border">
<input id="aFile" type="file" accept="image/*" class="w-full mt-2 text-xs"><img id="aPreview" class="hidden w-full h-32 object-cover rounded-xl mt-2">
<div class="grid grid-cols-3 gap-2 mt-3">
<input id="aDays" type="number" value="2" placeholder="Days" class="p-3 rounded-full bg-zinc-900 border text-center">
<input id="aHours" type="number" value="0" placeholder="Hours" class="p-3 rounded-full bg-zinc-900 border text-center">
<input id="aMins" type="number" value="0" placeholder="Mins" class="p-3 rounded-full bg-zinc-900 border text-center">
</div>
<div class="flex gap-1 mt-2 flex-wrap">
<button onclick="setPreset(1)" class="bg-zinc-800 px-3 py-2 rounded-full text-xs">1H</button>
<button onclick="setPreset(6)" class="bg-zinc-800 px-3 py-2 rounded-full text-xs">6H</button>
<button onclick="setPreset(24)" class="bg-yellow-600 px-3 py-2 rounded-full text-xs">24H</button>
<button onclick="setPreset(72)" class="bg-zinc-800 px-3 py-2 rounded-full text-xs">3D</button>
<button onclick="setPreset(168)" class="bg-zinc-800 px-3 py-2 rounded-full text-xs">7D</button>
</div>
<input id="aEndDate" type="datetime-local" class="w-full mt-3 p-3 rounded-full bg-zinc-900 border-2 border-yellow-500/30">
<button onclick="saveAuction()" class="w-full bg-red-600 py-3 rounded-full font-black mt-3">ADD AUCTION</button>
<p id="datePreview" class="text-xs text-green-400 mt-2 text-center"></p>
</div>
<div id="adminAuctionList" class="mt-4"></div>
</div>
<div id="admin-bidders" class="hidden mt-4"><div id="biddersList"></div></div>
<div id="admin-topups" class="hidden mt-4"><div id="topupsList"></div></div>
<button onclick="document.getElementById('admin').classList.add('hidden')" class="w-full bg-zinc-800 py-3 rounded-full mt-6">CLOSE</button>
</div>
</div>

<script>
const WA="27789313670"; const FEE=40;
let ADMIN_PIN=localStorage.getItem('kzn_pin')||'10111';
let adminUnlocked=sessionStorage.getItem('kzn_unlocked')==='true';
let products=JSON.parse(localStorage.getItem('kzn_shop')||'[]'); if(!products.length) products=[{id:1,n:"Maize 10kg",p:120,img:"https://via.placeholder.com/400x300/FFD700/000?text=Maize"}];
let auctionItems=JSON.parse(localStorage.getItem('kzn_auction')||'[]'); if(!auctionItems.length) auctionItems=[{id:101,n:"KZN Dress",start:200,current:200,step:10,bids:[],img:"https://via.placeholder.com/400x300/FF0000/FFF?text=DRESS",end:Date.now()+172800000,lockedAmount:0,lockedBy:null}];
let bidders=JSON.parse(localStorage.getItem('kzn_bidders')||'[]'); let topups=JSON.parse(localStorage.getItem('kzn_topups')||'[]'); let currentBidder=JSON.parse(localStorage.getItem('kzn_my')||'null'); let cart=[]; let tempImg='',aTempImg=''; let pendingBid={id:null,amt:0};

function openAdmin(){ if(adminUnlocked){document.getElementById('admin').classList.remove('hidden');renderAdminAuction();return;} document.getElementById('pinModal').classList.remove('hidden'); }
function checkPin(){ let v=document.getElementById('pinInput').value; if(v===ADMIN_PIN){adminUnlocked=true;sessionStorage.setItem('kzn_unlocked','true');document.getElementById('pinModal').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');document.getElementById('pinError').classList.add('hidden');renderAdminAuction();}else{document.getElementById('pinError').classList.remove('hidden');} }
function logoutAdmin(){adminUnlocked=false;sessionStorage.removeItem('kzn_unlocked');document.getElementById('admin').classList.add('hidden');}
function showView(v){document.getElementById('auctionView').classList.toggle('hidden',v!=='auction');document.getElementById('shopView').classList.toggle('hidden',v!=='shop');document.getElementById('walletView').classList.toggle('hidden',v!=='wallet');if(v==='auction')renderAuction();if(v==='shop')renderShop();if(v==='wallet')renderWallet();}
function adminTab(t){['auction','bidders','topups'].forEach(x=>document.getElementById('admin-'+x).classList.toggle('hidden',x!==t));document.querySelectorAll('[id^=at-]').forEach(b=>b.className='bg-zinc-800 px-4 py-2 rounded-full text-xs');document.getElementById('at-'+t).className='bg-yellow-400 text-black px-4 py-2 rounded-full font-black text-xs';if(t==='bidders')renderBidders();if(t==='topups')renderTopups();if(t==='auction')renderAdminAuction();}
function setPreset(h){ if(h<24){document.getElementById('aDays').value=0;document.getElementById('aHours').value=h;}else{document.getElementById('aDays').value=Math.floor(h/24);document.getElementById('aHours').value=h%24;} document.getElementById('aMins').value=0; document.getElementById('aEndDate').value=''; updatePreview();}
function updatePreview(){ let c=document.getElementById('aEndDate').value; let p=document.getElementById('datePreview'); if(c){p.innerHTML='Ends: '+new Date(c).toLocaleString();}else{let d=parseInt(document.getElementById('aDays').value)||0;let h=parseInt(document.getElementById('aHours').value)||0;let m=parseInt(document.getElementById('aMins').value)||0;let e=Date.now()+(d*86400000)+(h*3600000)+(m*60000);p.innerHTML='Ends: '+new Date(e).toLocaleString();}}
document.getElementById('aDays').addEventListener('input',updatePreview);document.getElementById('aHours').addEventListener('input',updatePreview);document.getElementById('aMins').addEventListener('input',updatePreview);document.getElementById('aEndDate').addEventListener('input',updatePreview);
function formatCountdown(end){ let diff=end-Date.now(); if(diff<=0)return{txt:'ENDED',ended:true}; let d=Math.floor(diff/86400000);let h=Math.floor(diff%86400000/3600000);let m=Math.floor(diff%3600000/60000);let s=Math.floor(diff%60000/1000); let txt=(d>0?d+'d ':'')+String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m '+String(s).padStart(2,'0')+'s'; return{txt:txt,ended:false};}
function toLocal(dt){ let d=new Date(dt); let o=d.getTimezoneOffset(); let l=new Date(d.getTime()-o*60000); return l.toISOString().slice(0,16);}

document.getElementById('aFile').addEventListener('change',e=>{let r=new FileReader();r.onload=ev=>{let im=new Image();im.onload=()=>{let ca=document.createElement('canvas');ca.width=400;ca.height=300;ca.getContext('2d').drawImage(im,0,0,400,300);aTempImg=ca.toDataURL('image/jpeg',0.6);document.getElementById('aPreview').src=aTempImg;document.getElementById('aPreview').classList.remove('hidden');};im.src=ev.target.result;};r.readAsDataURL(e.target.files[0]);});

function saveAuction(){ if(!adminUnlocked)return openAdmin(); let n=document.getElementById('aName').value;let s=parseInt(document.getElementById('aPrice').value);let step=parseInt(document.getElementById('aStep').value)||10; if(!n||!s||!aTempImg)return alert('Name+Price+Photo'); let end; let c=document.getElementById('aEndDate').value; if(c){end=new Date(c).getTime();if(end<=Date.now())return alert('Future date only');}else{let d=parseInt(document.getElementById('aDays').value)||0;let h=parseInt(document.getElementById('aHours').value)||0;let m=parseInt(document.getElementById('aMins').value)||0;if(d===0&&h===0&&m===0)d=2;end=Date.now()+(d*86400000)+(h*3600000)+(m*60000);} auctionItems.push({id:Date.now(),n:n,start:s,current:s,step:step,bids:[],img:aTempImg,end:end,lockedAmount:0,lockedBy:null}); localStorage.setItem('kzn_auction',JSON.stringify(auctionItems)); renderAuction();renderAdminAuction(); alert('Added '+n); }
function registerAuction(){ let name=document.getElementById('regName').value.trim();let phone=document.getElementById('regPhone').value.trim();let loc=document.getElementById('regLoc').value.trim(); if(!name||!phone)return alert('Name+Phone'); let b={id:Date.now(),name:name,phone:phone,loc:loc,paid:false,wallet:0,transactions:[]}; bidders.push(b);localStorage.setItem('kzn_bidders',JSON.stringify(bidders));currentBidder=b;localStorage.setItem('kzn_my',JSON.stringify(b));window.open('https://wa.me/'+WA+'?text=REG R40 '+name); checkReg(); }
function approveBidder(id){ if(!adminUnlocked)return openAdmin(); let b=bidders.find(x=>x.id===id); b.paid=true;localStorage.setItem('kzn_bidders',JSON.stringify(bidders));renderBidders(); if(currentBidder&&currentBidder.id===id){currentBidder.paid=true;localStorage.setItem('kzn_my',JSON.stringify(currentBidder));} checkReg();}
function quickTopUp(a){document.getElementById('topUpAmount').value=a; requestTopUp();}
function requestTopUp(){ if(!currentBidder)return alert('Register first'); let amt=parseInt(document.getElementById('topUpAmount').value); if(!amt||amt<20)return alert('Min R20'); let r={id:Date.now(),bidderId:currentBidder.id,name:currentBidder.name,phone:currentBidder.phone,amount:amt,status:'pending'}; topups.push(r);localStorage.setItem('kzn_topups',JSON.stringify(topups));window.open('https://wa.me/'+WA+'?text=TOP UP R'+amt+' '+currentBidder.name); alert('Request sent'); }
function approveTopUp(id){ if(!adminUnlocked)return openAdmin(); let req=topups.find(x=>x.id===id); if(!req||req.status==='approved')return; let idx=bidders.findIndex(x=>x.id===req.bidderId); bidders[idx].wallet=(bidders[idx].wallet||0)+req.amount; bidders[idx].transactions.push({desc:'Top up R'+req.amount,amount:req.amount}); req.status='approved'; localStorage.setItem('kzn_bidders',JSON.stringify(bidders));localStorage.setItem('kzn_topups',JSON.stringify(topups)); if(currentBidder&&currentBidder.id===req.bidderId){currentBidder.wallet=bidders[idx].wallet;currentBidder.transactions=bidders[idx].transactions;localStorage.setItem('kzn_my',JSON.stringify(currentBidder));renderWallet();} renderBidders();renderTopups(); alert('Credited R'+req.amount);}
function renderWallet(){ if(!currentBidder){document.getElementById('walletStatus').innerHTML='<p class="bg-red-900/40 p-3 rounded-xl">Not Registered</p>';document.getElementById('hWallet').innerText='0';return;} document.getElementById('hWallet').innerText=currentBidder.wallet||0; document.getElementById('walletStatus').innerHTML='<div class="bg-black p-4 rounded-xl border-2 border-yellow-400 mt-3"><p>WALLET</p><p class="text-3xl font-black text-yellow-400">R'+(currentBidder.wallet||0)+'</p><p class="text-xs">'+currentBidder.name+' '+(currentBidder.paid?'✅':'⏳')+'</p></div>'; let h=(currentBidder.transactions||[]).slice().reverse().map(t=>'<div class="flex justify-between text-xs py-2 border-b border-zinc-800"><span>'+t.desc+'</span><b>R'+t.amount+'</b></div>').join(''); document.getElementById('walletHistory').innerHTML=h||'No history';}
function checkReg(){ let box=document.getElementById('regStatus'); if(!currentBidder){box.innerHTML='<p class="bg-zinc-800 p-2 rounded-full text-xs">Register R40 + Top up</p>';document.getElementById('regBox').classList.remove('hidden');return;} if(!currentBidder.paid){box.innerHTML='<p class="bg-yellow-900/50 p-3 rounded-xl text-xs">PENDING R40 - '+currentBidder.name+'</p>';document.getElementById('regBox').classList.add('hidden');}else{box.innerHTML='<p class="bg-green-900/50 p-3 rounded-xl text-xs">✅ PAID - '+currentBidder.name+' Wallet R'+(currentBidder.wallet||0)+'</p>';document.getElementById('regBox').classList.add('hidden');}}

function selectBid(id,amt){ let item=auctionItems.find(x=>x.id===id); if(Date.now()>=item.end)return alert('Ended'); if(!currentBidder||!currentBidder.paid)return alert('Pay R40 first'); if((currentBidder.wallet||0)<amt)return alert('Wallet R'+(currentBidder.wallet||0)+' < R'+amt); pendingBid={id:id,amt:amt}; document.getElementById('bidText').innerHTML='Bid <b>R'+amt+'</b> for <b>'+item.n+'</b>?<br>Current R'+item.current+' → R'+amt; document.getElementById('bidWallet').innerHTML='Wallet R'+currentBidder.wallet+' → After R'+(currentBidder.wallet-amt); document.getElementById('bidModal').classList.remove('hidden');}
function customBid(id){ let v=parseInt(document.getElementById('bid-'+id).value); let item=auctionItems.find(x=>x.id===id); if(!v)return alert('Enter amount'); if(v<=item.current)return alert('Must be > R'+item.current); if(v<item.current+(item.step||10))return alert('Min R'+(item.current+(item.step||10))); selectBid(id,v);}
function confirmBid(){ let id=pendingBid.id; let amt=pendingBid.amt; let item=auctionItems.find(x=>x.id===id); if(Date.now()>=item.end){document.getElementById('bidModal').classList.add('hidden');return alert('Ended');} if(item.lockedBy){let prev=bidders.find(x=>x.id===item.lockedBy); if(prev){prev.wallet+=item.lockedAmount;}} currentBidder.wallet-=amt; currentBidder.transactions.push({desc:'Bid '+item.n+' R'+amt,amount:-amt}); let idx=bidders.findIndex(x=>x.id===currentBidder.id); if(idx>=0)bidders[idx]=currentBidder; item.current=amt;item.lockedAmount=amt;item.lockedBy=currentBidder.id;item.bids.unshift({name:currentBidder.name,amount:amt}); localStorage.setItem('kzn_bidders',JSON.stringify(bidders));localStorage.setItem('kzn_my',JSON.stringify(currentBidder));localStorage.setItem('kzn_auction',JSON.stringify(auctionItems)); document.getElementById('bidModal').classList.add('hidden'); renderAuction();renderWallet(); window.open('https://wa.me/'+WA+'?text=BID R'+amt+' '+item.n+' by '+currentBidder.name);}

function renderAuction(){ checkReg();renderWallet(); document.getElementById('auctionGrid').innerHTML=auctionItems.map(item=>{let cd=formatCountdown(item.end);let canBid=currentBidder&&currentBidder.paid&&!cd.ended;let step=item.step||10;let next=item.current+step;return '<div class="bg-zinc-900 border rounded-2xl overflow-hidden"><img src="'+item.img+'" class="w-full h-48 object-cover"><div class="p-4"><h3 class="font-black text-sm">'+item.n+'</h3><div class="bg-black rounded-full px-3 py-2 flex justify-between border mt-2"><span class="text-xs">⏰ '+(cd.ended?'ENDED':'ENDS')+'</span><span class="count text-xs '+(cd.ended?'text-red-500':'text-yellow-400')+'">'+cd.txt+'</span></div><p class="text-xs text-zinc-500 mt-1">Ends: '+new Date(item.end).toLocaleString()+' • Step R'+step+'</p><p class="text-xl font-black text-yellow-400 mt-2">R'+item.current+'</p><div class="bg-black p-2 rounded-xl mt-2 text-xs max-h-16 overflow-y-auto">'+(item.bids.slice(0,4).map(b=>'<div class="flex justify-between"><span>'+b.name+'</span><b>R'+b.amount+'</b></div>').join('')||'No bids')+'</div>'+(canBid?'<div class="mt-3 bg-black p-3 rounded-xl border"><p class="text-xs font-black text-yellow-400">Wallet R'+(currentBidder.wallet||0)+'</p><div class="grid grid-cols-4 gap-1 mt-2"><button onclick="selectBid('+item.id+','+next+')" class="bg-yellow-400 text-black py-2 rounded-full font-black text-xs">+'+step+'<br>R'+next+'</button><button onclick="selectBid('+item.id+','+(item.current+step*2)+')" class="bg-zinc-700 py-2 rounded-full text-xs">+'+(step*2)+'<br>R'+(item.current+step*2)+'</button><button onclick="selectBid('+item.id+','+(item.current+step*5)+')" class="bg-zinc-700 py-2 rounded-full text-xs">+'+(step*5)+'<br>R'+(item.current+step*5)+'</button><button onclick="selectBid('+item.id+','+(item.current+step*10)+')" class="bg-zinc-700 py-2 rounded-full text-xs">+'+(step*10)+'</button></div><div class="flex gap-2 mt-3"><input id="bid-'+item.id+'" type="number" value="'+next+'" class="flex-1 p-3 rounded-full bg-zinc-900 border text-center font-black"><button onclick="customBid('+item.id+')" class="bg-yellow-400 text-black px-6 py-3 rounded-full font-black text-xs">BID</button></div></div>':'<div class="mt-3 bg-zinc-800 py-3 rounded-full text-center text-xs font-black">'+(cd.ended?'🔴 ENDED':'🔒 Pay R40 + Top Up')+'</div>')+'</div></div>';}).join('');}
function renderBidders(){document.getElementById('biddersList').innerHTML=bidders.map(b=>'<div class="bg-black p-3 rounded-xl border mt-2 flex justify-between"><div><p class="font-bold text-xs">'+b.name+' '+(b.paid?'✅':'⏳')+'</p><p class="text-xs text-zinc-400">Wallet R'+(b.wallet||0)+' • '+b.phone+'</p></div><div class="flex flex-col gap-1">'+(!b.paid?'<button onclick="approveBidder('+b.id+')" class="bg-green-600 px-3 py-1 rounded-full text-xs">APPROVE</button>':'')+'<button onclick="addCredit('+b.id+')" class="bg-yellow-400 text-black px-3 py-1 rounded-full text-xs">+ADD</button></div></div>').join('')||'No bidders';}
function addCredit(id){if(!adminUnlocked)return openAdmin();let amt=parseInt(prompt('Add R:'));if(!amt)return;let idx=bidders.findIndex(x=>x.id===id);bidders[idx].wallet=(bidders[idx].wallet||0)+amt;localStorage.setItem('kzn_bidders',JSON.stringify(bidders));if(currentBidder&&currentBidder.id===id){currentBidder.wallet=bidders[idx].wallet;localStorage.setItem('kzn_my',JSON.stringify(currentBidder));renderWallet();}renderBidders();}
function renderTopups(){document.getElementById('topupsList').innerHTML=topups.slice().reverse().map(r=>'<div class="bg-black p-3 rounded-xl border mt-2 flex justify-between"><div><p class="text-xs font-bold">'+r.name+' R'+r.amount+' '+(r.status==='pending'?'⏳':'✅')+'</p><p class="text-xs text-zinc-400">'+r.phone+'</p></div>'+(r.status==='pending'?'<button onclick="approveTopUp('+r.id+')" class="bg-green-600 px-4 py-2 rounded-full text-xs">APPROVE R'+r.amount+'</button>':'<span class="text-green-400 text-xs">Done</span>')+'</div>').join('')||'No requests';}
function renderAdminAuction(){document.getElementById('adminAuctionList').innerHTML=auctionItems.map(a=>{let cd=formatCountdown(a.end);return '<div class="bg-black p-3 rounded-xl border mt-3"><div class="flex gap-2"><img src="'+a.img+'" class="w-16 h-16 rounded"><div><p class="font-bold text-xs">'+a.n+' Step R'+(a.step||10)+'</p><p class="text-xs text-yellow-400">R'+a.current+' locked R'+(a.lockedAmount||0)+'</p><p class="count text-xs '+(cd.ended?'text-red-500':'text-green-400')+'">⏰ '+cd.txt+'</p><p class="text-xs text-zinc-500">'+new Date(a.end).toLocaleString()+'</p></div></div><div class="grid grid-cols-4 gap-1 mt-3"><button onclick="extendTime('+a.id+',1)" class="bg-zinc-800 py-2 rounded-full text-xs">+1H</button><button onclick="extendTime('+a.id+',24)" class="bg-zinc-800 py-2 rounded-full text-xs">+24H</button><button onclick="extendTime('+a.id+',72)" class="bg-zinc-800 py-2 rounded-full text-xs">+3D</button><button onclick="endNow('+a.id+')" class="bg-red-600 py-2 rounded-full text-xs">END</button></div><div class="flex gap-1 mt-2"><input id="c-'+a.id+'" type="datetime-local" value="'+toLocal(a.end)+'" class="flex-1 p-2 rounded-full bg-zinc-900 border text-xs"><button onclick="setCustom('+a.id+')" class="bg-yellow-400 text-black px-3 py-2 rounded-full text-xs font-black">SET</button></div><div class="flex gap-1 mt-2"><button onclick="declareWinner('+a.id+')" class="flex-1 bg-green-600 py-2 rounded-full text-xs">WINNER</button><button onclick="deleteAuction('+a.id+')" class="bg-zinc-700 px-3 py-2 rounded-full text-xs">Delete</button></div></div>';}).join('')||'No items';}
function extendTime(id,h){let i=auctionItems.find(x=>x.id===id);i.end+=h*3600000;localStorage.setItem('kzn_auction',JSON.stringify(auctionItems));renderAdminAuction();renderAuction();}
function endNow(id){if(!confirm('End now?'))return;let i=auctionItems.find(x=>x.id===id);i.end=Date.now();localStorage.setItem('kzn_auction',JSON.stringify(auctionItems));renderAdminAuction();renderAuction();}
function setCustom(id){let v=document.getElementById('c-'+id).value;if(!v)return alert('Pick date');let i=auctionItems.find(x=>x.id===id);i.end=new Date(v).getTime();localStorage.setItem('kzn_auction',JSON.stringify(auctionItems));renderAdminAuction();renderAuction();alert('Date set '+new Date(i.end).toLocaleString());}
function deleteAuction(id){if(!confirm('Delete?'))return;auctionItems=auctionItems.filter(x=>x.id!==id);localStorage.setItem('kzn_auction',JSON.stringify(auctionItems));renderAdminAuction();renderAuction();}
function declareWinner(id){if(!adminUnlocked)return openAdmin();let item=auctionItems.find(x=>x.id===id);if(!item.lockedBy)return alert('No bids');let w=bidders.find(x=>x.id===item.lockedBy);window.open('https://wa.me/'+w.phone.replace(/\D/g,'')+'?text=WON '+item.n+' R'+item.lockedAmount);auctionItems=auctionItems.filter(x=>x.id!==id);localStorage.setItem('kzn_auction',JSON.stringify(auctionItems));renderAdminAuction();renderAuction();}
function renderShop(){document.getElementById('grid').innerHTML=products.map(p=>'<div class="bg-zinc-900 rounded-2xl overflow-hidden border"><img src="'+p.img+'" class="w-full h-32 object-cover"><div class="p-3"><p class="font-bold text-xs">'+p.n+'</p><p class="text-yellow-400 font-black">R'+p.p+'</p></div></div>').join('');}

renderAuction();renderWallet();updatePreview();
setInterval(()=>{renderAuction();if(adminUnlocked)renderAdminAuction();},1000);
localStorage.setItem('kzn_pin','10111');
</script>
</body>
</html>
