<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bongekile AI Store + Real Photos</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900;700&display=swap" rel="stylesheet">
<style>body{font-family:Outfit}</style>
</head>
<body class="bg-black text-white">
<div class="max-w-md mx-auto">

<div class="p-4 flex justify-between items-center sticky top-0 bg-black z-50 border-b border-zinc-800">
<h1 class="font-black">BONGEKILE<span class="text-yellow-400">.AI</span> 📸<br><span class="text-[8px] opacity-40">REAL PHOTOS • FREE AI • CHANCELE</span></h1>
<div class="bg-yellow-400 text-black px-3 py-1 rounded-full font-black text-[10px]">📸 PHOTOS LIVE</div>
</div>

<div class="m-4 bg-zinc-900 rounded-[24px] p-4 border">
<div id="chat" class="bg-black rounded-xl p-3 h-48 overflow-y-auto text-[13px]"><b class="text-yellow-400">AI:</b> Sawubona! Now with REAL product photos! Ask me "show me maize" 🆓</div>
<div class="flex gap-2 mt-3"><input id="q" onkeypress="if(event.key==='Enter')ask()" placeholder="Ask FREE AI..." class="flex-1 p-3 rounded-full bg-zinc-800 border text-sm"><button onclick="ask()" class="bg-yellow-400 text-black px-4 rounded-full font-black text-sm">Ask</button></div>
</div>

<div id="grid" class="grid grid-cols-2 gap-3 p-4"></div>

<div id="cartBtn" onclick="document.getElementById('cart').classList.remove('hidden')" class="fixed bottom-4 right-4 bg-yellow-400 text-black px-5 py-3 rounded-full font-black">🛒 <span id="count">0</span></div>

<div id="cart" class="hidden fixed inset-0 bg-black/90 z-50 p-4"><div class="max-w-sm mx-auto bg-white text-black rounded-[32px] p-5"><div id="list" class="space-y-2 text-sm"></div><p class="font-black text-xl mt-3">Total R<span id="total">0</span></p><button onclick="order()" class="w-full bg-black text-white py-3 rounded-full font-black mt-3">Order WhatsApp</button><button onclick="document.getElementById('cart').classList.add('hidden')" class="w-full bg-zinc-100 py-2 rounded-full mt-2">Close</button></div></div>
</div>

<script>
let products=[
{id:1,n:"Maize Meal 10kg",p:120,img:"https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400",t:"maize mpuphu pap"},
{id:2,n:"Cooking Oil 2L Sunfoil",p:65,img:"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=400",t:"oil amafutha"},
{id:3,n:"Sugar White 2.5kg",p:55,img:"https://images.unsplash.com/photo-1587049352851-8d4e89133924?w=400",t:"sugar ushukela"},
{id:4,n:"Eggs Tray 30 Large",p:95,img:"https://images.unsplash.com/photo-1518569656558-1f25e69d93d7?w=400",t:"eggs amaqanda"},
{id:5,n:"Chicken 5pcs Fresh",p:110,img:"https://images.unsplash.com/photo-1587593810167-a84920ea0781?w=400",t:"chicken inkukhu"},
{id:6,n:"Even & Lovely Lotion",p:35,img:"https://images.unsplash.com/photo-1556228720-195a672e8a03?w=400",t:"lotion beauty"},
{id:7,n:"Braids 1kg",p:85,img:"https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=400",t:"hair braids"},
{id:8,n:"Kiddies Dress Floral",p:150,img:"https://images.unsplash.com/photo-1518831959646-742c3a379ebf?w=400",t:"dress clothes"},
{id:9,n:"Sunlight Soap 2kg",p:45,img:"https://images.unsplash.com/photo-1584305574647-0cc949a2bb9f?w=400",t:"soap"},
{id:10,n:"Airtime MTN/Vodacom",p:20,img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400",t:"airtime"}
];
let cart=JSON.parse(localStorage.getItem('c')||'[]');

function render(){
 document.getElementById('grid').innerHTML=products.map(x=>`
 <div class="bg-zinc-900 rounded-[20px] overflow-hidden border border-zinc-800">
 <img src="${x.img}" class="w-full h-32 object-cover">
 <div class="p-3">
 <p class="font-bold text-[13px] leading-tight">${x.n}</p>
 <p class="text-yellow-400 font-black">R${x.p}</p>
 <button onclick="add(${x.id})" class="w-full mt-2 bg-white text-black py-2 rounded-full font-black text-xs">Add 🛒</button>
 </div>
 </div>`).join('');
 upd();
}
function add(id){ let p=products.find(a=>a.id===id); let ex=cart.find(a=>a.id===id); if(ex)ex.q++; else cart.push({...p,q:1}); localStorage.setItem('c',JSON.stringify(cart)); upd(); }
function upd(){
 document.getElementById('count').innerText=cart.reduce((a,b)=>a+b.q,0);
 let tot=cart.reduce((a,b)=>a+b.p*b.q,0); document.getElementById('total').innerText=tot;
 document.getElementById('list').innerHTML=cart.map((c,i)=>`<div class="flex gap-2 bg-zinc-50 p-2 rounded-xl"><img src="${c.img}" class="w-10 h-10 rounded object-cover"><span>${c.n} x${c.q}</span><b class="ml-auto">R${c.p*c.q} <button onclick="cart.splice(${i},1);localStorage.setItem('c',JSON.stringify(cart));upd()" class="text-red-500">x</button></b></div>`).join('');
}
function ask(){
 let q=document.getElementById('q').value.toLowerCase(); if(!q) return;
 let chat=document.getElementById('chat'); chat.innerHTML+=`<div class="bg-yellow-400 text-black p-2 rounded-xl ml-6 mt-2">You: ${q}</div>`;
 let found=products.filter(p=>p.t.includes(q)||p.n.toLowerCase().includes(q));
 let reply=found.length?`Found with REAL photo:<br>${found.map(f=>`<img src="${f.img}" class="w-16 h-16 rounded mt-1 inline-block"> ${f.n} R${f.p}`).join('<br>')}`:`We have: ${products.map(p=>p.n).join(', ')}`;
 chat.innerHTML+=`<div class="bg-zinc-800 p-2 rounded-xl mt-2"><b class="text-yellow-400">AI:</b> ${reply}</div>`; document.getElementById('q').value=''; chat.scrollTop=chat.scrollHeight;
 // filter grid
 if(found.length){ document.getElementById('grid').innerHTML=found.map(x=>`<div class="bg-zinc-900 rounded-[20px] overflow-hidden border border-yellow-500"><img src="${x.img}" class="w-full h-32 object-cover"><div class="p-3"><p class="font-bold text-[13px]">${x.n}</p><p class="text-yellow-400 font-black">R${x.p}</p><button onclick="add(${x.id})" class="w-full mt-2 bg-yellow-400 text-black py-2 rounded-full font-black text-xs">Add AI Pick</button></div></div>`).join(''); }
}
function order(){ let tot=cart.reduce((a,b)=>a+b.p*b.q,0); let msg=`Order Chancele:\n${cart.map(c=>c.n+' x'+c.q).join('\n')}\nTotal R${tot}`; window.open('https://wa.me/27784444444?text='+encodeURIComponent(msg)); }
render();
</script>
</body></html>
