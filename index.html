<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Bongekile Photos</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-4 max-w-md mx-auto">
<h1 class="font-black text-xl">📸 ADMIN - ADD PHOTOS<br><span class="text-[10px] opacity-50">Take photo → Save → Works on GitHub</span></h1>

<div class="mt-6 bg-zinc-900 rounded-2xl p-4">
<input id="name" placeholder="Product name e.g. Maize 10kg" class="w-full p-3 rounded-full bg-zinc-800 border text-sm">
<input id="price" type="number" placeholder="Price e.g. 120" class="w-full p-3 rounded-full bg-zinc-800 border mt-2 text-sm">
<input id="file" type="file" accept="image/*" capture="environment" class="w-full mt-3 text-sm">
<img id="preview" class="w-full h-40 object-cover rounded-xl mt-3 hidden">
<button onclick="save()" class="w-full bg-yellow-400 text-black py-4 rounded-full font-black mt-4">Save Product + Photo</button>
</div>

<div id="list" class="mt-6 space-y-3"></div>

<button onclick="exportData()" class="w-full bg-white text-black py-4 rounded-full font-black mt-6">Export to Store (Copy to index.html)</button>
<p id="export" class="text-[10px] mt-3 break-all bg-zinc-900 p-3 rounded-xl hidden"></p>

<a href="index.html" class="block text-center mt-4 text-yellow-400 font-bold">← Go to Store</a>

<script>
let products=JSON.parse(localStorage.getItem('myProducts')||'[]');
let currentImg='';

document.getElementById('file').onchange=e=>{
 let r=new FileReader();
 r.onload=()=>{ currentImg=r.result; document.getElementById('preview').src=currentImg; document.getElementById('preview').classList.remove('hidden'); }
 r.readAsDataURL(e.target.files[0]);
}

function save(){
 let n=document.getElementById('name').value;
 let p=document.getElementById('price').value;
 if(!n||!p||!currentImg) return alert('Add name, price, photo');
 products.push({id:Date.now(),n:n,p:parseInt(p),img:currentImg});
 localStorage.setItem('myProducts',JSON.stringify(products));
 document.getElementById('name').value=''; document.getElementById('price').value='';
 alert('Saved! '+n); render();
}

function render(){
 document.getElementById('list').innerHTML=products.map((x,i)=>`
 <div class="bg-zinc-900 rounded-xl p-3 flex gap-3">
 <img src="${x.img}" class="w-16 h-16 rounded-xl object-cover">
 <div><p class="font-bold text-sm">${x.n}</p><p class="text-yellow-400 font-black">R${x.p}</p>
 <button onclick="products.splice(${i},1);localStorage.setItem('myProducts',JSON.stringify(products));render()" class="text-red-400 text-xs">Delete</button></div>
 </div>`).join('')||'No products yet';
}
function exportData(){
 let code=JSON.stringify(products);
 document.getElementById('export').classList.remove('hidden');
 document.getElementById('export').innerText='COPY THIS INTO index.html:\n\nlet products='+code+';\n\nThen git push';
 navigator.clipboard.writeText(code);
 alert('Copied! Now paste into index.html');
}
render();
</script>
</body></html>
