<div class="flex gap-2 mt-4 overflow-x-auto"><button onclick="adminTab('auction')" id="at-auction" class="bg-yellow-400 text-black px-4 py-2 rounded-full font-black text-xs">AUCTION</button><button onclick="adminTab('bidders')" id="at-bidders" class="bg-zinc-800 px-4 py-2 rounded-full text-xs">BIDDERS</button><button onclick="adminTab('topups')" id="at-topups" class="bg-zinc-800 px-4 py-2 rounded-full text-xs">TOP UPS</button><button onclick="adminTab('shop')" id="at-shop" class="bg-zinc-800 px-4 py-2 rounded-full text-xs">SHOP</button></div>

<script>
const WA="27789313670"; const FEE=40;
let ADMIN_PIN = localStorage.getItem('kzn_admin_pin') || '10111';
let adminUnlocked = sessionStorage.getItem('kzn_admin_unlocked')==='true';
let products=JSON.parse(localStorage.getItem('kzn_shop')||'[]'); if(!products.length) products=[{id:1,n:"Maize 10kg",p:120,s:15,c:"food",img:"https://via.placeholder.com/400x300/FFD700/000?text=Maize"}];
let auctionItems=JSON.parse(localStorage.getItem('kzn_auction')||'[]'); if(!auctionItems.length) auctionItems=[{id:101,n:"KZN Dress Auction",start:200,current:200,step:10,bids:[],img:"https://via.placeholder.com/400x300/FF0000/FFF?text=DRESS",end:Date.now()+86400000*2,lockedAmount:0,lockedBy:null}];
let bidders=JSON.parse(localStorage.getItem('kzn_bidders')||'[]'); let topups=JSON.parse(localStorage.getItem('kzn_topups')||'[]'); let currentBidder=JSON.parse(localStorage.getItem('kzn_myBidder')||'null'); let cart=[],tempImg='',aTempImg='',cur='all';
let pendingBid={itemId:null, amount:0};

function openAdmin(){ if(adminUnlocked){document.getElementById('admin').classList.remove('hidden'); renderAdminAuction(); return;} document.getElementById('pinModal').classList.remove('hidden'); document.getElementById('pinInput').value=''; document.getElementById('pinInput').focus();}
function checkPin(){let e=document.getElementById('pinInput').value; if(e===ADMIN_PIN){adminUnlocked=true; sessionStorage.setItem('kzn_admin_unlocked','true'); document.getElementById('pinModal').classList.add('hidden'); document.getElementById('admin').classList.remove('hidden'); renderAdminAuction();}else{document.getElementById('pinError').classList.remove('hidden'); document.getElementById('pinInput').value='';}}
function logoutAdmin(){adminUnlocked=false; sessionStorage.removeItem('kzn_admin_unlocked'); document.getElementById('admin').classList.add('hidden');}
document.getElementById('pinInput').addEventListener('keypress',e=>{if(e.key==='Enter') checkPin();});

function formatCountdown(end){ let diff=end-Date.now(); if(diff<=0) return {text:"ENDED 🔴", ended:true}; let d=Math.floor(diff/86400000); let h=Math.floor((diff%86400000)/3600000); let m=Math.floor((diff%3600000)/60000); let s=Math.floor((diff%60000)/1000); let txt=""; if(d>0) txt+=d+"d "; txt+=String(h).padStart(2,'0')+"h "+String(m).padStart(2,'0')+"m "+String(s).padStart(2,'0')+"s"; return {text:txt, ended:false};}
function toLocalDateTimeString(ts){ let dt=new Date(ts); let off=dt.getTimezoneOffset(); let loc=new Date(dt.getTime()-off*60000); return loc.toISOString().slice(0,16); }
function showView(v){document.getElementById('auctionView').classList.toggle('hidden',v!=='auction');document.getElementById('shopView').classList.toggle('hidden',v!=='shop');document.getElementById('walletView').classList.toggle('hidden',v!=='wallet'); if(v==='auction') renderAuction(); if(v==='shop') render(); if(v==='wallet') renderWallet();}
function adminTab(t){['shop','auction','bidders','topups'].forEach(x=>document.getElementById('admin-'+x).classList.toggle('hidden',x!==t)); document.querySelectorAll('[id^=at-]').forEach(b=>b.className='bg-zinc-800 px-4 py-2 rounded-full text-xs'); document.getElementById('at-'+t).className='bg-yellow-400 text-black px-4 py-2 rounded-full font-black text-xs'; if(t==='bidders') renderBidders(); if(t==='auction') renderAdminAuction(); if(t==='topups') renderTopups();}
document.getElementById('pFile').addEventListener('change',e=>{let r=new FileReader(); r.onload=ev=>{let im=new Image(); im.onload=()=>{let ca=document.createElement('canvas'); ca.width=400; ca.height=300; ca.getContext('2d').drawImage(im,0,0,400,300); tempImg=ca.toDataURL('image/jpeg',0.6); document.getElementById('preview').src=tempImg; document.getElementById('preview').classList.remove('hidden')}; im.src=ev.target.result}; r.readAsDataURL(e.target.files[0])});
document.getElementById('aFile').addEventListener('change',e=>{let r=new FileReader(); r.onload=ev=>{let im=new Image(); im.onload=()=>{let ca=document.createElement('canvas'); ca.width=400; ca.height=300; ca.getContext('2d').drawImage(im,0,0,400,300); aTempImg=ca.toDataURL('image/jpeg',0.6); document.getElementById('aPreview').src=aTempImg; document.getElementById('aPreview').classList.remove('hidden')}; im.src=ev.target.result}; r.readAsDataURL(e.target.files[0])});
function saveProduct(){if(!adminUnlocked) return openAdmin(); let n=document.getElementById('pName').value, p=parseInt(document.getElementById('pPrice').value); if(!n||!p||!tempImg) return alert('Name+Price+Photo'); products.push({id:Date.now(),n:n,p:p,s:10,c:"food",img:tempImg}); localStorage.setItem('kzn_shop',JSON.stringify(products)); render();}
function saveAuction(){
 if(!adminUnlocked) return openAdmin();
 let n=document.getElementById('aName').value, s=parseInt(document.getElementById('aPrice').value); let step=parseInt(document.getElementById('aBidStep').value)||10;
 if(!n||!s||!aTempImg) return alert('Name+Price+Photo');
 let endTime; let custom=document.getElementById('aEndDate').value;
 if(custom){ endTime=new Date(custom).getTime(); if(isNaN(endTime)||endTime<=Date.now()) return alert('Future date required'); }
 else { let d=parseInt(document.getElementById('aDays').value)||0; let h=parseInt(document.getElementById('aHours').value)||0; let m=parseInt(document.getElementById('aMins').value)||0; if(d===0&&h===0&&m===0) d=2; endTime=Date.now()+(d*86400000)+(h*3600000)+(m*60000); }
 auctionItems.push({id:Date.now(),n:n,start:s,current:s,step:step,bids:[],img:aTempImg,end:endTime,lockedAmount:0,lockedBy:null});
 localStorage.setItem('kzn_auction',JSON.stringify(auctionItems)); renderAuction(); renderAdminAuction(); alert(`Added ${n} step R${step}`);
}
function registerAuction(){let name=document.getElementById('regName').value.trim(), phone=document.getElementById('regPhone').value.trim(), loc=document.getElementById('regLoc').value.trim(); if(!name||!phone) return alert('Name + Phone'); let bidder={id:Date.now(),name:name,phone:phone,loc:loc,paid:false,wallet:0,transactions:[{type:'register',amount:0,desc:'Account created',date:new Date().toLocaleString()}]}; bidders.push(bidder); localStorage.setItem('kzn_bidders',JSON.stringify(bidders)); currentBidder=bidder; localStorage.setItem('kzn_myBidder',JSON.stringify(bidder)); window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(`KZN REG R${FEE}: ${name} ${phone}`)); alert(`Registered! Pay R${FEE}`); checkReg(); renderWallet();}
function approveBidder(id){if(!adminUnlocked) return openAdmin(); let b=bidders.find(x=>x.id===id); b.paid=true; localStorage.setItem('kzn_bidders',JSON.stringify(bidders)); renderBidders(); if(currentBidder&&currentBidder.id===id){currentBidder.paid=true; localStorage.setItem('kzn_myBidder',JSON.stringify(currentBidder));} checkReg(); alert('Approved '+b.name);}
function quickTopUp(a){document.getElementById('topUpAmount').value=a; requestTopUp();}
function requestTopUp(){if(!currentBidder) return alert('Register first!'); let amt=parseInt(document.getElementById('topUpAmount').value); if(!amt||amt<20) return alert('Min R20'); let req={id:Date.now(),bidderId:currentBidder.id,name:currentBidder.name,phone:currentBidder.phone,amount:amt,status:'pending',date:new Date().toLocaleString()}; topups.push(req); localStorage.setItem('kzn_topups',JSON.stringify(topups)); window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(`WALLET TOP UP R${amt} Name:${currentBidder.name}`)); alert(`Request R${amt} sent!`); document.getElementById('topUpAmount').value=''; renderTopups();}
function approveTopUp(id){if(!adminUnlocked) return openAdmin(); let req=topups.find(x=>x.id===id); if(!req||req.status==='approved') return; let idx=bidders.findIndex(x=>x.id===req.bidderId); bidders[idx].wallet=(bidders[idx].wallet||0)+req.amount; bidders[idx].transactions.push({type:'topup',amount:req.amount,desc:`Top up R${req.amount}`,date:new Date().toLocaleString()}); req.status='approved'; localStorage.setItem('kzn_bidders',JSON.stringify(bidders)); localStorage.setItem('kzn_topups',JSON.stringify(topups)); if(currentBidder&&currentBidder.id===req.bidderId){currentBidder.wallet=bidders[idx].wallet; currentBidder.transactions=bidders[idx].transactions; localStorage.setItem('kzn_myBidder',JSON.stringify(currentBidder)); renderWallet();} renderBidders(); renderTopups(); alert(`✅ R${req.amount} credited`);}

function renderWallet(){if(!currentBidder){document.getElementById('walletStatus').innerHTML=`<div class="bg-red-900/40 p-4 rounded-xl mt-3"><p class="font-black">❌ Not Registered</p></div>`; document.getElementById('walletHistory').innerHTML=''; document.getElementById('headerWallet').innerText='0'; return;} document.getElementById('headerWallet').innerText=currentBidder.wallet||0; document.getElementById('walletStatus').innerHTML=`<div class="mt-3 grid grid-cols-2 gap-3"><div class="bg-black rounded-xl p-4 border-2 border-yellow-400"><p class="text-[10px] text-zinc-400">WALLET</p><p class="text-3xl font-black text-yellow-400">R${currentBidder.wallet||0}</p></div><div class="bg-black rounded-xl p-4 border border-zinc-800"><p class="font-bold text-sm">${currentBidder.name}</p><p class="text-[10px]">${currentBidder.phone}</p></div></div>`; let hist=(currentBidder.transactions||[]).slice().reverse().map(t=>`<div class="flex justify-between text-[11px] py-2 border-b border-zinc-800"><span>${t.desc}</span><b class="${t.amount>=0?'text-green-400':'text-red-400'}">${t.amount>=0?'+':''}R${t.amount}</b></div>`).join('')||'No tx'; document.getElementById('walletHistory').innerHTML=`<h3 class="font-black text-xs mb-2">HISTORY</h3>${hist}`;}
function checkReg(){let box=document.getElementById('regStatus'); if(!currentBidder){box.innerHTML=`<p class="text-[11px] bg-zinc-800 p-2 rounded-full">❌ Register R${FEE} + Top up</p>`; document.getElementById('regBox').classList.remove('hidden'); return;} if(!currentBidder.paid){box.innerHTML=`<div class="bg-yellow-900/50 border border-yellow-500 p-3 rounded-xl"><p class="font-black text-yellow-400 text-xs">⏳ PENDING R${FEE} - ${currentBidder.name}</p></div>`; document.getElementById('regBox').classList.add('hidden');} else{box.innerHTML=`<div class="bg-green-900/50 border border-green-500 p-3 rounded-xl flex justify-between items-center"><div><p class="font-black text-green-400 text-xs">✅ PAID - ${currentBidder.name}</p><p class="text-[11px]">Wallet: R${currentBidder.wallet||0}</p></div><button onclick="showView('wallet')" class="bg-yellow-400 text-black px-3 py-2 rounded-full font-black text-xs">💰 R${currentBidder.wallet||0}</button></div>`; document.getElementById('regBox').classList.add('hidden');}}

// FIXED BIDDING SELECTION
function selectBidAmount(itemId, amount){
 let item=auctionItems.find(x=>x.id===itemId);
 if(Date.now()>=item.end) return alert('Auction ended!');
 if(!currentBidder||!currentBidder.paid) return alert(`Register + Pay R${FEE} first!`);
 if((currentBidder.wallet||0)<amount) return alert(`Wallet R${currentBidder.wallet||0} < R${amount} - Top up!`);
 pendingBid={itemId:itemId, amount:amount};
 document.getElementById('bidConfirmText').innerHTML=`Bid <b>R${amount}</b> for <b>${item.n}</b>?<br>Current: R${item.current} → Your bid: R${amount}`;
 document.getElementById('bidConfirmWallet').innerHTML=`Wallet: R${currentBid
